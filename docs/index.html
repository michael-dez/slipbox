<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slipbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #ddd;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Search bar ── */
    #search-bar {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    #search {
      width: 340px;
      padding: 9px 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(18, 18, 36, 0.92);
      color: #eee;
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s;
    }

    #search:focus { border-color: rgba(255, 255, 255, 0.4); }
    #search::placeholder { color: #555; }

    #toggle-tags {
      margin-left: 10px;
      padding: 9px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(18, 18, 36, 0.92);
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s, color 0.2s;
    }
    #toggle-tags:hover { border-color: rgba(255, 255, 255, 0.4); color: #eee; }
    #toggle-tags.active {
      color: hsl(40, 70%, 70%);
      border-color: hsl(40, 70%, 50%);
    }

    /* ── Graph canvas ── */
    svg { display: block; cursor: grab; }
    svg:active { cursor: grabbing; }

    .link {
      fill: none;
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 1.5;
    }

    .link.dimmed     { stroke: rgba(255, 255, 255, 0.04); }
    .link.highlighted { stroke: rgba(255, 255, 255, 0.65); stroke-width: 2; }

    .node-circle {
      stroke: rgba(255, 255, 255, 0.25);
      stroke-width: 1.5;
      cursor: pointer;
    }

    .node-circle:hover { stroke: #fff; stroke-width: 2.5; }

    .node-label {
      font-size: 10px;
      fill: rgba(210, 210, 230, 0.7);
      pointer-events: none;
      user-select: none;
    }

    .node.dimmed .node-circle { opacity: 0.1; }
    .node.dimmed .node-label  { opacity: 0.08; }
    .node.highlighted .node-circle { stroke: #fff; stroke-width: 2.5; }

    .tag-node .node-circle {
      stroke: rgba(220, 180, 100, 0.55);
      stroke-dasharray: 2 2;
    }
    .tag-node .node-label {
      fill: rgba(220, 180, 100, 0.8);
      font-style: italic;
    }
    .link.tag-link {
      stroke: rgba(220, 180, 100, 0.13);
      stroke-dasharray: 3 3;
    }
    .link.tag-link.highlighted { stroke: rgba(220, 180, 100, 0.55); }

    /* ── Tooltip ── */
    #tooltip {
      position: absolute;
      background: rgba(10, 10, 25, 0.93);
      border: 1px solid rgba(255, 255, 255, 0.13);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.65;
      pointer-events: none;
      display: none;
      max-width: 250px;
      backdrop-filter: blur(8px);
    }

    #tooltip strong { color: #fff; display: block; margin-bottom: 2px; }
    #tooltip .date  { color: #777; font-size: 11px; }
    #tooltip .tags  { color: #999; font-size: 11px; margin-top: 5px; }
    #tooltip .hint  { color: #445; font-size: 10px; margin-top: 6px; font-style: italic; }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      color: #666;
      pointer-events: none;
    }

    .legend-label { margin-bottom: 4px; }

    .legend-grad {
      width: 120px;
      height: 7px;
      border-radius: 4px;
      /* red → orange → yellow → green → blue → violet through full HSL spectrum */
      background: linear-gradient(
        to right,
        hsl(0,80%,55%),
        hsl(54,80%,55%),
        hsl(108,80%,55%),
        hsl(162,80%,55%),
        hsl(216,80%,55%),
        hsl(270,80%,55%)
      );
      margin-bottom: 4px;
    }

    .legend-caps {
      display: flex;
      justify-content: space-between;
      width: 120px;
    }
  </style>
</head>
<body>

  <div id="search-bar">
    <input id="search" type="text" placeholder="Search titles or tags…"
           autocomplete="off" spellcheck="false" />
    <button id="toggle-tags" type="button">Show tags</button>
  </div>

  <div id="tooltip"></div>

  <div id="legend">
    <div class="legend-label">connections →</div>
    <div class="legend-grad"></div>
    <div class="legend-caps"><span>0</span><span>most</span></div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const NOTE_R = 8;
    const TAG_R  = 6;

    fetch("graph.json")
      .then(r => r.json())
      .then(render);

    function render(data) {
      let W = window.innerWidth;
      let H = window.innerHeight;
      let showTags = false;

      const svg = d3.select("body").append("svg")
        .attr("width", W)
        .attr("height", H);

      const zoom = d3.zoom()
        .scaleExtent([0.05, 10])
        .on("zoom", ({ transform }) => g.attr("transform", transform));

      svg.call(zoom);
      const g = svg.append("g");

      // viewBox: x goes 0→8, y goes -4→4; tip of triangle at (8,0) = refX
      svg.append("defs").append("marker")
        .attr("id", "arrow")
        .attr("viewBox", "0 -4 8 8")
        .attr("refX", 8)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-4L8,0L0,4Z")
        .attr("fill", "rgba(255,255,255,0.35)");

      // Tag edges get a longer, weaker spring so high-degree tag hubs don't
      // collapse the whole graph onto themselves.
      const sim = d3.forceSimulation()
        .force("link",
          d3.forceLink().id(d => d.id)
            .distance(l => l.type === "tag" ? 180 : 130)
            .strength(l => l.type === "tag" ? 0.18 : null))
        .force("charge", d3.forceManyBody().strength(-380))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collide", d3.forceCollide(NOTE_R + 6));

      const linkLayer = g.append("g");
      const nodeLayer = g.append("g");
      let linkSel = linkLayer.selectAll("line");
      let nodeSel = nodeLayer.selectAll("g.node");

      let visibleNodes = [];
      let visibleLinks = [];
      let deg = {};
      let maxDeg = 1;

      const tooltip = d3.select("#tooltip");

      const radiusOf = d => d.type === "tag" ? TAG_R : NOTE_R;

      // Red (hue 0°) → Violet (hue 270°) for notes; tags use a fixed warm hue.
      const colorOf = d => {
        if (d.type === "tag") return "hsl(40, 70%, 60%)";
        const t = (deg[d.id] || 0) / maxDeg;
        return `hsl(${Math.round(t * 270)},80%,55%)`;
      };

      function update() {
        visibleNodes = showTags
          ? data.nodes
          : data.nodes.filter(n => n.type !== "tag");
        const visibleIds = new Set(visibleNodes.map(n => n.id));
        visibleLinks = data.links.filter(l =>
          visibleIds.has(nodeId(l.source)) && visibleIds.has(nodeId(l.target))
        );

        // Note color is keyed off note↔note degree only; tag edges are
        // excluded so they don't shift every note toward violet.
        deg = {};
        visibleNodes.forEach(n => (deg[n.id] = 0));
        visibleLinks.forEach(l => {
          if (l.type === "tag") return;
          const sid = nodeId(l.source);
          const tid = nodeId(l.target);
          deg[sid] = (deg[sid] || 0) + 1;
          deg[tid] = (deg[tid] || 0) + 1;
        });
        maxDeg = Math.max(1, ...Object.values(deg));

        linkSel = linkLayer.selectAll("line")
          .data(visibleLinks, d => `${nodeId(d.source)}->${nodeId(d.target)}`)
          .join("line")
          .attr("class", d => "link" + (d.type === "tag" ? " tag-link" : ""))
          .attr("marker-end", d => d.type === "tag" ? null : "url(#arrow)");

        nodeSel = nodeLayer.selectAll("g.node")
          .data(visibleNodes, d => d.id)
          .join(enter => {
            const ng = enter.append("g")
              .attr("class", d => "node" + (d.type === "tag" ? " tag-node" : ""))
              .call(
                d3.drag()
                  .on("start", (e, d) => {
                    if (!e.active) sim.alphaTarget(0.3).restart();
                    d.fx = d.x; d.fy = d.y;
                    d._dragged = false;
                  })
                  .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; d._dragged = true; })
                  .on("end",   (e, d) => {
                    if (!e.active) sim.alphaTarget(0);
                    d.fx = null; d.fy = null;
                  })
              )
              .on("mouseover", (_, d) => {
                if (d.type === "tag") {
                  tooltip.style("display", "block").html(
                    `<strong>${d.title}</strong>` +
                    `<span class="hint">click to filter notes by this tag</span>`
                  );
                } else {
                  const tags = d.tags.length ? d.tags.join(", ") : "—";
                  tooltip.style("display", "block").html(
                    `<strong>${d.title}</strong>` +
                    `<span class="date">${d.date || "no date"}</span>` +
                    `<span class="tags">🏷 ${tags}</span>` +
                    `<span class="hint">click to open note</span>`
                  );
                }
              })
              .on("mousemove", ev => {
                tooltip
                  .style("left", (ev.pageX + 16) + "px")
                  .style("top",  (ev.pageY - 12) + "px");
              })
              .on("mouseout", () => tooltip.style("display", "none"))
              .on("click", (_, d) => {
                if (d._dragged) { d._dragged = false; return; }
                if (d.type === "tag") {
                  const tagName = d.id.replace(/^tag:/, "");
                  const input = document.getElementById("search");
                  input.value = tagName;
                  input.dispatchEvent(new Event("input"));
                  return;
                }
                window.open(`notes/${d.id}.html`, "_blank");
              });

            ng.append("circle").attr("class", "node-circle");
            ng.append("text").attr("class", "node-label").attr("dy", "0.35em");
            return ng;
          });

        nodeSel.select(".node-circle")
          .attr("r", radiusOf)
          .attr("fill", colorOf);

        nodeSel.select(".node-label")
          .attr("x", d => radiusOf(d) + 5)
          .text(d => d.title.length > 30 ? d.title.slice(0, 29) + "…" : d.title);

        sim.nodes(visibleNodes);
        sim.force("link").links(visibleLinks);
        sim.alpha(0.6).restart();
      }

      // Shorten each end of a link to the node boundary so the arrow is
      // visible and doesn't overlap the circle.
      sim.on("tick", () => {
        linkSel
          .attr("x1", d => d.source.x + unitVec(d).ux * radiusOf(d.source))
          .attr("y1", d => d.source.y + unitVec(d).uy * radiusOf(d.source))
          .attr("x2", d => d.target.x - unitVec(d).ux * radiusOf(d.target))
          .attr("y2", d => d.target.y - unitVec(d).uy * radiusOf(d.target));

        nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
      });

      update();

      d3.select("#toggle-tags").on("click", function () {
        showTags = !showTags;
        this.textContent = showTags ? "Hide tags" : "Show tags";
        this.classList.toggle("active", showTags);
        update();
      });

      d3.select("#search").on("input", function () {
        const q = this.value.trim().toLowerCase();

        if (!q) {
          nodeSel.classed("dimmed", false).classed("highlighted", false);
          linkSel.classed("dimmed", false).classed("highlighted", false);
          return;
        }

        const titleHits = [];
        const matched = new Set();

        visibleNodes.forEach(n => {
          const byTitle = n.title.toLowerCase().includes(q);
          const byTag   = n.tags.some(t => t.toLowerCase().includes(q));
          if (byTitle && n.type !== "tag") titleHits.push(n.id);
          if (byTitle || byTag) matched.add(n.id);
        });

        nodeSel.classed("dimmed",      d => !matched.has(d.id));
        nodeSel.classed("highlighted", d =>  matched.has(d.id));

        linkSel.classed("dimmed", d => {
          const sid = nodeId(d.source);
          const tid = nodeId(d.target);
          return !matched.has(sid) && !matched.has(tid);
        });
        linkSel.classed("highlighted", d => {
          const sid = nodeId(d.source);
          const tid = nodeId(d.target);
          return matched.has(sid) && matched.has(tid);
        });

        // Pan & zoom to a single exact title match
        if (titleHits.length === 1) {
          const hit = visibleNodes.find(n => n.id === titleHits[0]);
          if (hit && hit.x != null) focusNode(hit, W, H, svg, zoom);
        }
      });

      window.addEventListener("resize", () => {
        W = window.innerWidth; H = window.innerHeight;
        svg.attr("width", W).attr("height", H);
        sim.force("center", d3.forceCenter(W / 2, H / 2)).alpha(0.3).restart();
      });
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function unitVec(d) {
      const dx = d.target.x - d.source.x;
      const dy = d.target.y - d.source.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      return { ux: dx / len, uy: dy / len };
    }

    function nodeId(n) {
      return typeof n === "object" ? n.id : n;
    }

    function focusNode(node, W, H, svg, zoom) {
      svg.transition().duration(750).call(
        zoom.transform,
        d3.zoomIdentity
          .translate(W / 2, H / 2)
          .scale(2.5)
          .translate(-node.x, -node.y)
      );
    }
  </script>
</body>
</html>
